<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通联统计组件预览</title>
  <!-- 直接引用插件内的组件静态资源 -->
  <link rel="stylesheet" href="../src/main/resources/static/qso-stats.css" />
  <style>
    body { margin: 0; padding: 3rem 1.25rem; background: #f6f7f9; color: #1f2328;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
           "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .page { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .hint { font-size: .85rem; color: #6b7280; margin-bottom: 2rem; }
    .hint code { background: #eceef1; padding: .1em .4em; border-radius: 4px; }
    /* 模拟暗色主题下组件的表现 */
    .dark-theme { --qso-stats-accent: #60a5fa; --qso-stats-card-bg: rgba(255,255,255,.06);
                  --qso-stats-card-border: rgba(255,255,255,.14); --qso-stats-muted: rgba(255,255,255,.7);
                  --qso-stats-track: rgba(255,255,255,.18); }
    .dark-theme-box { margin-top: 3rem; padding: 2rem 1.25rem; background: #111827; border-radius: 12px; }
    .dark-theme-box h2 { color: #f9fafb; font-size: 1.1rem; margin: 0 0 1rem; }
  </style>
</head>
<body>
  <div class="page">
    <h1>通联统计组件预览（非 Halo 环境，使用模拟数据）</h1>
    <p class="hint">
      组件在主题中的真实效果取决于主题样式；本页展示默认样式（亮色），
      下方为暗色主题下的 CSS 变量覆盖示例。
      属性示例：<code>data-endpoint</code> 指向 <code>mock-stats.json</code>。
    </p>

    <!-- 亮色主题下的组件 -->
    <div class="qso-stats-widget" data-qso-stats-widget
         data-endpoint="mock-stats.json" data-refresh="0"></div>
  </div>

  <div class="dark-theme-box">
    <h2>暗色主题覆盖示例（--qso-stats-* 变量）</h2>
    <!-- 暗色主题下的组件：外层容器定义覆盖变量 -->
    <div class="qso-stats-widget dark-theme" data-qso-stats-widget
         data-endpoint="mock-stats.json"></div>
  </div>

  <script src="../src/main/resources/static/qso-stats.js"></script>
</body>
</html>
