apiVersion: v1alpha1
kind: Setting
metadata:
  name: qso-stats-settings
spec:
  forms:
    - group: api
      label: Wavelog API 配置
      formSchema:
        - $formkit: text
          name: baseUrl
          label: Wavelog 站点地址
          value: ""
          help: "例如 https://log.example.com（可带 /index.php 前缀）。插件会自动拼接 /index.php/api/v2/ 访问统计接口。"
        - $formkit: password
          name: apiToken
          label: API Token
          value: ""
          help: "在 Wavelog 用户菜单的 API 页面创建 v2 Token（wl2_ 开头），需要 statistic:read 和 qso:read 权限。"
        - $formkit: number
          name: cacheSeconds
          label: 缓存时间（秒）
          value: 300
          min: 10
          max: 86400
          help: "Wavelog 数据缓存时长，避免每次访问都请求日志平台。缓存到期后会检测数据是否有更新：有更新才刷新缓存与「更新于」时间，无更新则沿用原缓存。"
        - $formkit: number
          name: timeoutSeconds
          label: 请求超时（秒）
          value: 10
          min: 1
          max: 60
        - $formkit: text
          name: pageTitle
          label: 统计页面标题
          value: "通联统计"
          help: "用于 /qso-stats 页面与浏览器标签页标题。"

    - group: stats
      label: 统计项目
      formSchema:
        - $formkit: array
          name: items
          label: 展示的统计项目
          value:
            - key: total_qsos
              title: 通联总数
              enabled: true
            - key: activity
              title: 活跃度
              enabled: true
            - key: dxcc
              title: DXCC 字头
              enabled: true
            - key: bands
              title: 波段分布
              enabled: true
              limit: 6
            - key: modes
              title: 模式分布
              enabled: true
              limit: 6
            - key: recent
              title: 最近通联
              enabled: true
              limit: 5
          itemLabels:
            - type: text
              label: $value.title
          help: "可增删、排序、启停统计项目；每个项目的标题可自定义。"
          children:
            - $formkit: select
              name: key
              label: 统计类型
              value: total_qsos
              options:
                - label: 通联总数
                  value: total_qsos
                - label: 活跃度（今日 / 本月 / 今年）
                  value: activity
                - label: DXCC 字头
                  value: dxcc
                - label: 波段分布
                  value: bands
                - label: 模式分布
                  value: modes
                - label: 最近通联
                  value: recent
            - $formkit: text
              name: title
              label: 显示标题
              value: ""
            - $formkit: switch
              name: enabled
              label: 启用
              value: true
            - $formkit: number
              name: limit
              label: 显示条数
              value: 5
              min: 1
              max: 50
              if: "$value.key === 'bands' || $value.key === 'modes' || $value.key === 'recent'"
              help: "仅对波段分布、模式分布、最近通联生效。"

    - group: display
      label: 展示与交互
      formSchema:
        # 数据展示样式选择（新增）
        - $formkit: select
          name: displayStyle
          label: 数据展示样式
          value: modern
          options:
            - label: 现代仪表盘（Bento · 推荐）
              value: modern
            - label: 经典卡片
              value: classic
          help: "选择 /qso-stats 统计页面的展示风格。现代仪表盘包含贯穿横幅、玻璃拟态查询卡与 Bento 指标网格；经典卡片为精简网格卡片。"
        - $formkit: select
          name: defaultTheme
          label: 默认主题
          value: auto
          options:
            - label: 跟随站点主题色（推荐）
              value: auto
            - label: 浅色
              value: light
            - label: 深色
              value: dark
          help: "统计页面默认的亮 / 暗主题；「跟随站点主题色」会随站点主题自动适配，也可强制指定浅色或深色。"
        # 呼号查询与 OQRS（原「呼号查询与 OQRS」分组并入本分组）
        - $formkit: switch
          name: searchEnabled
          label: 启用呼号查询与 OQRS
          value: true
          help: "在统计组件中显示呼号查询框，可按呼号检索通联记录并一键提交 OQRS 卡片申请。需要 Wavelog 站点已启用 OQRS（站点设置中为电台位置开启 OQRS），且 API Token 具备 qso:read 权限。"
        - $formkit: number
          name: searchMaxResults
          label: 查询结果上限
          value: 50
          min: 5
          max: 200
          help: "呼号查询最多返回并展示的通联条数（按时间倒序）。"
        - $formkit: switch
          name: showSectionTitle
          label: 显示区块标题
          value: true
          help: "仅对嵌入式组件生效；独立统计页面的标题由主题渲染，插件会自动隐藏区块标题，避免双重标题。"
        - $formkit: text
          name: sectionTitle
          label: 区块标题
          value: "通联统计"
          help: "组件顶部的标题文字。"
        - $formkit: switch
          name: showUpdatedAt
          label: 显示数据更新时间
          value: true
        - $formkit: text
          name: fallbackText
          label: 加载失败提示文案
          value: "统计数据暂不可用，请稍后再试"

    - group: layout
      label: 统计页面布局
      formSchema:
        - $formkit: array
          name: panels
          label: 面板顺序与显隐
          value:
            - key: search
              enabled: true
              span: 2
            - key: kpi
              enabled: true
              span: 2
            - key: day
              enabled: true
              span: 1
            - key: month
              enabled: true
              span: 1
            - key: mode
              enabled: true
              span: 1
            - key: band
              enabled: true
              span: 1
            - key: year
              enabled: true
              span: 1
            - key: recent
              enabled: true
              span: 1
          itemLabels:
            - type: text
              label: $value.key
          help: "自定义统计页面的展示顺序与显隐：搜索、KPI、日/月/历年、模式/频段、最近通联。可拖拽排序、停用不需要的面板；「整行/半行」控制图表面板占位宽度（默认两两并排）。"
          children:
            - $formkit: select
              name: key
              label: 面板
              value: search
              options:
                - label: 呼号查询
                  value: search
                - label: 核心指标（KPI）
                  value: kpi
                - label: 日统计（近 30 日）
                  value: day
                - label: 月统计（本年每月）
                  value: month
                - label: 模式分布
                  value: mode
                - label: 频段分布
                  value: band
                - label: 历年通联
                  value: year
                - label: 最近通联
                  value: recent
            - $formkit: switch
              name: enabled
              label: 启用
              value: true
            - $formkit: select
              name: span
              label: 占位
              value: 1
              options:
                - label: 半行（与其他面板并排）
                  value: 1
                - label: 整行（独占一行）
                  value: 2
              help: "搜索与 KPI 恒为整行，此项仅对图表面板生效。"
