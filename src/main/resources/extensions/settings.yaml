apiVersion: v1alpha1
kind: Setting
metadata:
  name: qso-stats-settings
spec:
  forms:
    - group: api
      label: Wavelog API 配置
      formSchema:
        - $formkit: text
          name: baseUrl
          label: Wavelog 站点地址
          value: ""
          help: "例如 https://log.example.com（可带 /index.php 前缀）。插件会自动拼接 /index.php/api/v2/ 访问统计接口。"
        - $formkit: password
          name: apiToken
          label: API Token
          value: ""
          help: "在 Wavelog 用户菜单的 API 页面创建 v2 Token（wl2_ 开头），需要 statistic:read 和 qso:read 权限。"
        - $formkit: number
          name: cacheSeconds
          label: 缓存时间（秒）
          value: 300
          min: 10
          max: 86400
          help: "Wavelog 数据缓存时长，避免每次访问都请求日志平台。"
        - $formkit: number
          name: timeoutSeconds
          label: 请求超时（秒）
          value: 10
          min: 1
          max: 60
        - $formkit: text
          name: pageTitle
          label: 统计页面标题
          value: "通联统计"
          help: "用于 /qso-stats 页面与浏览器标签页标题。"

    - group: stats
      label: 统计项目
      formSchema:
        - $formkit: array
          name: items
          label: 展示的统计项目
          value:
            - key: total_qsos
              title: 通联总数
              enabled: true
            - key: activity
              title: 活跃度
              enabled: true
            - key: dxcc
              title: DXCC 字头
              enabled: true
            - key: bands
              title: 波段分布
              enabled: true
              limit: 6
            - key: modes
              title: 模式分布
              enabled: true
              limit: 6
            - key: recent
              title: 最近通联
              enabled: true
              limit: 5
          itemLabels:
            - type: text
              label: $value.title
          help: "可增删、排序、启停统计项目；每个项目的标题可自定义。"
          children:
            - $formkit: select
              name: key
              label: 统计类型
              value: total_qsos
              options:
                - label: 通联总数
                  value: total_qsos
                - label: 活跃度（今日 / 本月 / 今年）
                  value: activity
                - label: DXCC 字头
                  value: dxcc
                - label: 波段分布
                  value: bands
                - label: 模式分布
                  value: modes
                - label: 最近通联
                  value: recent
            - $formkit: text
              name: title
              label: 显示标题
              value: ""
            - $formkit: switch
              name: enabled
              label: 启用
              value: true
            - $formkit: number
              name: limit
              label: 显示条数
              value: 5
              min: 1
              max: 50
              if: "$value.key === 'bands' || $value.key === 'modes' || $value.key === 'recent'"
              help: "仅对波段分布、模式分布、最近通联生效。"

    - group: display
      label: 展示设置
      formSchema:
        - $formkit: switch
          name: showSectionTitle
          label: 显示区块标题
          value: true
        - $formkit: text
          name: sectionTitle
          label: 区块标题
          value: "通联统计"
          help: "组件顶部的标题文字。"
        - $formkit: switch
          name: showUpdatedAt
          label: 显示数据更新时间
          value: true
        - $formkit: text
          name: fallbackText
          label: 加载失败提示文案
          value: "统计数据暂不可用，请稍后再试"
