<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
  <th:block th:fragment="head">
    <!-- 组件静态资源由 QsoStatsHeadProcessor 统一注入（带版本号，避免 CDN 缓存旧版），此处不再重复引入 -->
    <title th:text="${title}">通联统计</title>
  </th:block>
  <th:block th:fragment="content">
    <div class="qso-stats-page">
      <h1 class="qso-stats-page__title" th:text="${title}">通联统计</h1>
      <div class="qso-stats-widget" data-qso-stats-widget></div>
    </div>
  </th:block>
</html>
